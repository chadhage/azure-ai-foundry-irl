<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 830" role="img" aria-labelledby="ontology-business-model-title ontology-business-model-description" style="font-family:Segoe UI,Aptos,Calibri,sans-serif"><title id="ontology-business-model-title">Business ontology and source bindings</title><desc id="ontology-business-model-description">A fictional commerce vocabulary makes entity types, properties, relationships and their source bindings explicit. Ontology supplies business context, not a new general-purpose query engine. Graph materialization is optional, not automatic.</desc><style>:root{--cp-bg:#f7f4ef;--cp-surface:#ffffff;--cp-border:#919191;--cp-text:#242424;--cp-text-muted:#5c5c5c;--cp-text-soft:#6f6f6f;--cp-accent:#b11f4b}@media(prefers-color-scheme:dark){:root{--cp-bg:#3d3b3a;--cp-surface:#292929;--cp-border:#919191;--cp-text:#dedede;--cp-text-muted:#b0b0b0;--cp-text-soft:#b0b0b0;--cp-accent:#fd8ea1}}</style><defs><marker id="ontology-business-model-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--cp-accent)"/></marker></defs><rect width="1280" height="830" fill="var(--cp-bg)"/><text x="32" y="52" font-size="28" fill="var(--cp-text)"><tspan x="32" dy="0">Business ontology and source bindings</tspan></text><text x="32" y="88" font-size="16" fill="var(--cp-text-soft)"><tspan x="32" dy="0">Connected Fabric IQ preview - optional | REFERENCE DESIGN - NOT DEPLOYED</tspan></text><rect x="32" y="128" width="1216" height="362" rx="10" fill="none" stroke="var(--cp-border)" stroke-dasharray="7 5"/><text x="48" y="159" font-size="17" fill="var(--cp-text-soft)"><tspan x="48" dy="0">Synthetic namespace: demo.commerce - entity types, not customer data</tspan></text><polyline points="284,282 360,282" fill="none" stroke="var(--cp-accent)" stroke-width="2" marker-end="url(#ontology-business-model-arrow)"/><polyline points="596,282 680,282" fill="none" stroke="var(--cp-accent)" stroke-width="2" marker-end="url(#ontology-business-model-arrow)"/><polyline points="916,282 1000,282" fill="none" stroke="var(--cp-accent)" stroke-width="2" marker-end="url(#ontology-business-model-arrow)"/><polyline points="656,566 656,490" fill="none" stroke="var(--cp-accent)" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ontology-business-model-arrow)"/><polyline points="416,630 480,630" fill="none" stroke="var(--cp-accent)" stroke-width="2" marker-end="url(#ontology-business-model-arrow)"/><polyline points="832,630 896,630" fill="none" stroke="var(--cp-accent)" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ontology-business-model-arrow)"/><rect x="289.64" y="245" width="64.72" height="22" rx="4" fill="var(--cp-bg)"/><text x="322" y="260" font-size="14" fill="var(--cp-text-soft)" text-anchor="middle"><tspan x="322" dy="0">places</tspan></text><rect x="597.52" y="245" width="80.96" height="22" rx="4" fill="var(--cp-bg)"/><text x="638" y="260" font-size="14" fill="var(--cp-text-soft)" text-anchor="middle"><tspan x="638" dy="0">contains</tspan></text><rect x="913.46" y="245" width="89.08" height="22" rx="4" fill="var(--cp-bg)"/><text x="958" y="260" font-size="14" fill="var(--cp-text-soft)" text-anchor="middle"><tspan x="958" dy="0">refers to</tspan></text><rect x="748" y="507" width="240" height="40.9" rx="4" fill="var(--cp-bg)"/><text x="868" y="522" font-size="14" fill="var(--cp-text-soft)" text-anchor="middle"><tspan x="868" dy="0">Definitions and relationship</tspan><tspan x="868" dy="18.9">mappings</tspan></text><rect x="423.76" y="595" width="48.48" height="22" rx="4" fill="var(--cp-bg)"/><text x="448" y="610" font-size="14" fill="var(--cp-text-soft)" text-anchor="middle"><tspan x="448" dy="0">Bind</tspan></text><rect x="827.58" y="595" width="72.84" height="22" rx="4" fill="var(--cp-bg)"/><text x="864" y="610" font-size="14" fill="var(--cp-text-soft)" text-anchor="middle"><tspan x="864" dy="0">Context</tspan></text><g data-node-id="customer"><rect x="64" y="214" width="220" height="136" rx="10" fill="var(--cp-surface)" stroke="var(--cp-border)"/><text x="80" y="244" font-size="16" fill="var(--cp-text)"><tspan x="80" dy="0">Customer</tspan></text><text x="80" y="278" font-size="14" fill="var(--cp-text-soft)"><tspan x="80" dy="0">customerId: string</tspan><tspan x="80" dy="18.9">segment: string</tspan></text></g><g data-node-id="order"><rect x="360" y="214" width="236" height="136" rx="10" fill="var(--cp-surface)" stroke="var(--cp-border)"/><text x="376" y="244" font-size="16" fill="var(--cp-text)"><tspan x="376" dy="0">Order</tspan></text><text x="376" y="278" font-size="14" fill="var(--cp-text-soft)"><tspan x="376" dy="0">orderId / customerId</tspan><tspan x="376" dy="18.9">status / amount</tspan></text></g><g data-node-id="line"><rect x="680" y="214" width="236" height="136" rx="10" fill="var(--cp-surface)" stroke="var(--cp-border)"/><text x="696" y="244" font-size="16" fill="var(--cp-text)"><tspan x="696" dy="0">OrderLine</tspan></text><text x="696" y="278" font-size="14" fill="var(--cp-text-soft)"><tspan x="696" dy="0">lineId / orderId</tspan><tspan x="696" dy="18.9">productId / quantity</tspan></text></g><g data-node-id="product"><rect x="1000" y="214" width="216" height="136" rx="10" fill="var(--cp-surface)" stroke="var(--cp-border)"/><text x="1016" y="244" font-size="16" fill="var(--cp-text)"><tspan x="1016" dy="0">Product</tspan></text><text x="1016" y="278" font-size="14" fill="var(--cp-text-soft)"><tspan x="1016" dy="0">productId: string</tspan><tspan x="1016" dy="18.9">category: string</tspan></text></g><g data-node-id="lakehouse"><rect x="64" y="566" width="352" height="128" rx="10" fill="var(--cp-surface)" stroke="var(--cp-border)"/><image x="80" y="584" width="40" height="40" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="136" y="598" font-size="18" fill="var(--cp-text)"><tspan x="136" dy="0">Fabric Lakehouse</tspan></text><text x="80" y="649" font-size="15" fill="var(--cp-text-soft)"><tspan x="80" dy="0">Governed source tables</tspan><tspan x="80" dy="20.25">Data remains at source</tspan></text></g><g data-node-id="ontology"><rect x="480" y="566" width="352" height="128" rx="10" fill="var(--cp-surface)" stroke="var(--cp-border)"/><image x="496" y="584" width="40" height="40" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="552" y="598" font-size="18" fill="var(--cp-text)"><tspan x="552" dy="0">Fabric IQ ontology</tspan></text><text x="496" y="649" font-size="15" fill="var(--cp-text-soft)"><tspan x="496" dy="0">Definitions + bindings (preview)</tspan><tspan x="496" dy="20.25">Entity / property / relationship</tspan></text></g><g data-node-id="consumer"><rect x="896" y="566" width="320" height="128" rx="10" fill="var(--cp-surface)" stroke="var(--cp-border)"/><text x="912" y="598" font-size="18" fill="var(--cp-text)"><tspan x="912" dy="0">Supported consumers</tspan></text><text x="912" y="631" font-size="15" fill="var(--cp-text-soft)"><tspan x="912" dy="0">Agents / dashboards</tspan><tspan x="912" dy="20.25">Query authorized bound sources</tspan></text></g><text x="32" y="785" font-size="15" fill="var(--cp-text-soft)"><tspan x="32" dy="0">Solid: primary flow / semantic relationship    Dashed: supporting evidence, control or return</tspan></text><text x="32" y="810" font-size="14" fill="var(--cp-text-soft)"><tspan x="32" dy="0">Public Microsoft sources: MS07, MS08 | See companion documentation for scope and exclusions.</tspan></text></svg>
